# One file per country, written by scripts/add-country.sh to
# /etc/nginx/portal-locations/home-<NAME>.conf and pulled into the portal
# site with "include /etc/nginx/portal-locations/*.conf;".
# Replace <NAME> with the lowercase line name (e.g. jp) and <XRAY_WS_PORT>
# with that line's Xray WS port (e.g. 11001).

location /home-<NAME> {
    proxy_pass http://127.0.0.1:<XRAY_WS_PORT>;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
