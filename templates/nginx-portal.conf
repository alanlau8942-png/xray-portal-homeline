# nginx site for the portal (Variant P).
# Install: copy to /etc/nginx/sites-available/portal and replace <YOUR_DOMAIN>.
# Port 80 serves the ACME challenge and redirects everything else to HTTPS.
# Port 443 serves the portal page and proxies WebSocket paths to local Xray
# inbounds. Per-country locations live in /etc/nginx/portal-locations/*.conf
# (one file per country, written by scripts/add-country.sh) and are pulled in
# with the include below — add a country without ever editing this file.

server {
    listen 80 default_server;
    server_name <YOUR_DOMAIN>;

    location /.well-known/acme-challenge/ {
        root /var/www/portal;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name <YOUR_DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/portal;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Main datacenter line: VLESS + WebSocket on 127.0.0.1:10000, path /vless
    location /vless {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Per-country residential lines, one file each:
    #   /etc/nginx/portal-locations/home-<name>.conf
    # Each file holds a single "location /home-<name> { ... }" block that
    # proxies to that country's Xray WS inbound (127.0.0.1:11001+).
    include /etc/nginx/portal-locations/*.conf;
}
